<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1A2A36;
            color: #F1F1F1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Styling */
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #2C3E50;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .container h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #50C9C3;
        }

        /* Input Styling */
        input[type="text"], input[type="email"], input[type="password"], input[type="submit"] {
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            background-color: #34495E;
            color: #F1F1F1;
        }

        input[type="submit"] {
            background-color: #50C9C3;
            color: #1A2A36;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #1ABC9C;
            transform: translateY(-3px);
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Forgot Password Button */
        .forgot-password {
            margin-top: 10px;
            font-size: 14px;
            color: #F1F1F1;
            text-decoration: none;
            background-color: #34495E;
            padding: 8px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .forgot-password:hover {
            background-color: #50C9C3;
        }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" name="email" id="email" placeholder="Enter your email" required>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
            
            <!-- Radio Group for Role Selection -->
            <div class="radio-group">
                <label>
                    <input type="radio" name="role" value="student" required> Student
                </label>
                <label>
                    <input type="radio" name="role" value="teacher" required> Teacher
                </label>
            </div>

            <input type="submit" value="Login">
        </form>

        <!-- Forgot Password Link -->
        <a href="{{ url_for('forgot_password') }}" class="forgot-password">Forgot Password?</a>

        <p id="errorMessage" class="error-message" style="display: none;">Invalid credentials or role selection!</p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const container = document.getElementById('loginContainer');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.querySelector('input[name="role"]:checked').value;

            const userData = JSON.parse(localStorage.getItem(email));  // Retrieve user data from localStorage

            if (userData && userData.password === password) {
                // User found and credentials match
                if ((role === 'student' && email === userData.email && userData.role === "student") || 
                    (role === 'teacher' && email === userData.email && userData.role === "teacher")) {
                    window.location.href = role === "student" ? "/student_interface" : "/teacher_interface";
                } else {
                    errorMessage.style.display = "block";
                    container.classList.add("shake");
                    setTimeout(() => container.classList.remove("shake"), 500);
                }
            } else {
                errorMessage.style.display = "block";
                container.classList.add("shake");
                setTimeout(() => container.classList.remove("shake"), 500);
            }
        });
    </script>
</body>
</html>
